<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc">
  <title id="title">NJM2100 pin orientation on the two photographed packages</title>
  <desc id="desc">Two vertically arranged eight-pin NJM2100 package diagrams matching the owner photograph. Each has the orientation dot at upper-left. Pins 1 through 4 descend on the left and pins 8 through 5 descend on the right. Top and bottom refer only to photograph position.</desc>
  <style>
    .bg { fill: #f7f9fb; }
    .package { fill: #27313b; stroke: #111820; stroke-width: 3; }
    .lead { fill: #c5ccd3; stroke: #66717c; stroke-width: 2; }
    .dot { fill: #f7f9fb; }
    .title { fill: #17212b; font: 700 30px system-ui, sans-serif; }
    .subtitle { fill: #43505c; font: 20px system-ui, sans-serif; }
    .chip { fill: #ffffff; font: 700 25px system-ui, sans-serif; text-anchor: middle; }
    .position { fill: #dce8f2; font: 700 21px system-ui, sans-serif; text-anchor: middle; }
    .pin { fill: #17212b; font: 700 20px ui-monospace, monospace; }
    .function { fill: #43505c; font: 18px system-ui, sans-serif; }
    .note { fill: #17212b; font: 19px system-ui, sans-serif; text-anchor: middle; }
    .warning { fill: #7a3e00; font: 700 19px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <rect class="bg" width="1000" height="950"/>
  <text class="title" x="500" y="52" text-anchor="middle">NJM2100 pin orientation on the physical reference board</text>
  <text class="subtitle" x="500" y="86" text-anchor="middle">Top view, matching the owner-board photograph</text>

  <!-- Photo-upper package -->
  <text class="position" x="500" y="132">PHOTO-UPPER PACKAGE · MARKED 2100</text>
  <rect class="package" x="360" y="155" width="280" height="280" rx="18"/>
  <circle class="dot" cx="398" cy="190" r="13"/>
  <text class="chip" x="500" y="280">NJM2100</text>
  <text class="chip" x="500" y="315">dual op-amp</text>
  <rect class="lead" x="320" y="185" width="40" height="26"/><rect class="lead" x="640" y="185" width="40" height="26"/>
  <rect class="lead" x="320" y="250" width="40" height="26"/><rect class="lead" x="640" y="250" width="40" height="26"/>
  <rect class="lead" x="320" y="315" width="40" height="26"/><rect class="lead" x="640" y="315" width="40" height="26"/>
  <rect class="lead" x="320" y="380" width="40" height="26"/><rect class="lead" x="640" y="380" width="40" height="26"/>
  <text class="pin" x="300" y="205" text-anchor="end">1</text><text class="function" x="286" y="205" text-anchor="end">OUT A · </text>
  <text class="pin" x="300" y="270" text-anchor="end">2</text><text class="function" x="286" y="270" text-anchor="end">IN− A · </text>
  <text class="pin" x="300" y="335" text-anchor="end">3</text><text class="function" x="286" y="335" text-anchor="end">IN+ A · </text>
  <text class="pin" x="300" y="400" text-anchor="end">4</text><text class="function" x="286" y="400" text-anchor="end">V− · </text>
  <text class="pin" x="700" y="205">8</text><text class="function" x="728" y="205">· V+</text>
  <text class="pin" x="700" y="270">7</text><text class="function" x="728" y="270">· OUT B</text>
  <text class="pin" x="700" y="335">6</text><text class="function" x="728" y="335">· IN− B</text>
  <text class="pin" x="700" y="400">5</text><text class="function" x="728" y="400">· IN+ B</text>

  <!-- Photo-lower package -->
  <text class="position" x="500" y="502">PHOTO-LOWER PACKAGE · MARKED 2100</text>
  <rect class="package" x="360" y="525" width="280" height="280" rx="18"/>
  <circle class="dot" cx="398" cy="560" r="13"/>
  <text class="chip" x="500" y="650">NJM2100</text>
  <text class="chip" x="500" y="685">dual op-amp</text>
  <rect class="lead" x="320" y="555" width="40" height="26"/><rect class="lead" x="640" y="555" width="40" height="26"/>
  <rect class="lead" x="320" y="620" width="40" height="26"/><rect class="lead" x="640" y="620" width="40" height="26"/>
  <rect class="lead" x="320" y="685" width="40" height="26"/><rect class="lead" x="640" y="685" width="40" height="26"/>
  <rect class="lead" x="320" y="750" width="40" height="26"/><rect class="lead" x="640" y="750" width="40" height="26"/>
  <text class="pin" x="300" y="575" text-anchor="end">1</text><text class="function" x="286" y="575" text-anchor="end">OUT A · </text>
  <text class="pin" x="300" y="640" text-anchor="end">2</text><text class="function" x="286" y="640" text-anchor="end">IN− A · </text>
  <text class="pin" x="300" y="705" text-anchor="end">3</text><text class="function" x="286" y="705" text-anchor="end">IN+ A · </text>
  <text class="pin" x="300" y="770" text-anchor="end">4</text><text class="function" x="286" y="770" text-anchor="end">V− · </text>
  <text class="pin" x="700" y="575">8</text><text class="function" x="728" y="575">· V+</text>
  <text class="pin" x="700" y="640">7</text><text class="function" x="728" y="640">· OUT B</text>
  <text class="pin" x="700" y="705">6</text><text class="function" x="728" y="705">· IN− B</text>
  <text class="pin" x="700" y="770">5</text><text class="function" x="728" y="770">· IN+ B</text>

  <text class="note" x="500" y="855">Orientation dot = pin 1 corner · numbering proceeds counter-clockwise</text>
  <text class="warning" x="500" y="894">Upper/lower describe photograph position only—not PCB designator or signal-stage order.</text>
</svg>
